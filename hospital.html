<style>
    /* 筛选栏容器 */
    .region-filter {
        width: 100%;

    }

    .filter-title {
        font-size: 18px;

        color: #333;
        margin-bottom: 15px;
        line-height: 1.5;
    }

    /* 筛选按钮容器 - 流式布局 */
    .filter-buttons {
        display: flex;

        gap: 10px; /* 按钮间距 */
        align-items: center;
        margin-bottom: 30px;
    }

    /* 筛选按钮样式 */
    .region-btn {
        padding: 8px 18px;
        background-color: #f5f7fa;
        border: 1px solid #e5e9f2;
        border-radius: 6px;
        color: #333;
        font-size: 14px;
        cursor: pointer;
        transition: all 0.2s ease;

    }

    /* 选中状态 */
    .region-btn.active {
        background-color: #2f54eb;
        color: #fff;
    }

    /* 悬停效果 */
    .region-btn:hover:not(.active) {
        background-color: #e8f0fe;
    }

    /* 客户列表容器 */
    .customer-list {
        width: 100%;
        padding: 0 10px;
    }

    /* 客户列表标题 */
    .customer-title {
        font-size: 16px;
        font-weight: 600;
        color: #333;
        margin-bottom: 15px;
    }

    /* 客户卡片容器 */
    .customer-cards {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 16px;
    }

    /* 客户卡片样式 */
    .customer-card {
        padding: 16px;
        background-color: #fff;
        border: 1px solid #e5e9f2;

    }

    .customer-name {
        font-size: 14px;
        color: #333;
        line-height: 1.5;
    }

    /* 省份标签样式 */
    .province-tag {
        font-size: 12px;
        color: #2f54eb;
        background-color: #e8f0fe;
        padding: 2px 8px;
        border-radius: 4px;
        margin-right: 8px;
    }

    /* 移动端适配 */
    @media (max-width: 768px) {
        .filter-buttons {
            gap: 8px;
        }
        .region-btn {
            padding: 6px 14px;
            font-size: 13px;
        }
        .filter-title {
            font-size: 16px;
        }
        .customer-cards {
            grid-template-columns: 1fr;
        }
    }

                }
            }
            
            card.innerHTML = `<div class="customer-name">${provinceTag}${institution}</div>`;
            customerContainer.appendChild(card);
        });
    }
</script>
